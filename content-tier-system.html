function ContentTierSystem() {

  const [selectedPage, setSelectedPage] = useState("homepage");
  const [hoveredSection, setHoveredSection] = useState(null);
  const [selectedSection, setSelectedSection] = useState(null);

              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div style={{ background: sn.surface, border: `1px solid ${sn.border}`, borderRadius: 12, padding: 18 }}>
                  <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".1em", color: sn.brand, marginBottom: 12 }}>Use here</div>
                  {activeTier.whenUse.map((w, i) => (
                    <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8, alignItems: "flex-start" }}>
                      <div style={{ width: 5, height: 5, borderRadius: "50%", background: activeTier.color, marginTop: 6, flexShrink: 0 }} />
                      <div style={{ fontSize: 12, color: sn.g100, lineHeight: 1.5 }}>{w}</div>
                    </div>
                  ))}
                  <div style={{ height: 1, background: sn.border, margin: "14px 0" }} />
                  <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".1em", color: sn.g400, marginBottom: 10 }}>Not here</div>
                  {activeTier.whenNot.map((w, i) => (
                    <div key={i} style={{ display: "flex", gap: 8, marginBottom: 7, alignItems: "flex-start" }}>
                      <div style={{ fontSize: 12, color: sn.g400, marginTop: 1, flexShrink: 0 }}>–</div>
                      <div style={{ fontSize: 12, color: sn.g400, lineHeight: 1.5 }}>{w}</div>
                    </div>
                  ))}
                </div>
                <div style={{ background: sn.surface, border: `1px solid ${sn.border}`, borderRadius: 12, padding: 18 }}>
                  <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".1em", color: sn.brand, marginBottom: 12 }}>Live examples</div>
                  {activeTier.examples.map((ex, i) => (
                    <div key={i} style={{
                      background: `rgba(${activeTier.rgb},.05)`, border: `1px solid rgba(${activeTier.rgb},.14)`,
                      borderLeft: `3px solid ${activeTier.color}`,
                      borderRadius: 8, padding: "10px 14px", marginBottom: 10,
                      fontSize: 12, color: sn.g100, lineHeight: 1.65, fontStyle: "italic",
                    }}>
                      {ex}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Mixing rules */}
          <div style={{ background: sn.surface, border: `1px solid ${sn.border}`, borderRadius: 12, padding: 22 }}>
            <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".1em", color: sn.brand, marginBottom: 18 }}>
              Rules for mixing tiers on a page
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14 }}>
              {MIXING_RULES.map((r, i) => (
                <div key={i} style={{ border: `1px solid ${sn.border}`, borderRadius: 8, padding: 14 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: sn.white, marginBottom: 7 }}>{r.rule}</div>
                  <div style={{ fontSize: 11, color: sn.g400, lineHeight: 1.65 }}>{r.detail}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ════════════════════════════════════
          WIREFRAMES TAB
      ════════════════════════════════════ */}
      {activeTab === "wireframes" && (
        <div style={{ display: "flex", height: "calc(100vh - 160px)" }}>

          {/* Page selector sidebar */}
          <div style={{ width: 210, borderRight: `1px solid ${sn.border}`, padding: "16px 12px", flexShrink: 0, overflowY: "auto" }}>
            <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".1em", color: sn.g400, marginBottom: 12 }}>Page Examples</div>
            {Object.entries(PAGES).map(([key, p]) => (
              <button
                key={key}
                onClick={() => { setSelectedPage(key); setSelectedSection(null); }}
                style={{
                  width: "100%", textAlign: "left",
                  background: selectedPage === key ? sn.card : "none",
                  border: selectedPage === key ? `1px solid ${sn.border}` : "1px solid transparent",
                  borderRadius: 8, padding: "10px 12px", cursor: "pointer", marginBottom: 4,
                }}
              >
                <div style={{ fontSize: 12, fontWeight: 600, color: selectedPage === key ? sn.white : sn.g400 }}>{p.name}</div>
                <div style={{ fontSize: 10, color: sn.g400, marginTop: 2 }}>{p.tierRange}</div>
              </button>
            ))}

            {/* Compact tier legend */}
            <div style={{ marginTop: 22, borderTop: `1px solid ${sn.border}`, paddingTop: 16 }}>
              <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".1em", color: sn.g400, marginBottom: 12 }}>Tier legend</div>
              {TIERS.map((t) => (
                <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 7 }}>
                  <div style={{ width: 10, height: 10, borderRadius: 3, background: t.color, flexShrink: 0 }} />
                  <div style={{ fontSize: 11, color: sn.g400 }}>
                    <span style={{ color: t.color, fontWeight: 700 }}>{t.label}</span> {t.name}
                  </div>
                </div>
              ))}
            </div>

            {/* Tier distribution for selected page */}
            <div style={{ marginTop: 18, borderTop: `1px solid ${sn.border}`, paddingTop: 16 }}>
              <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".1em", color: sn.g400, marginBottom: 12 }}>Tier distribution</div>
              {(() => {
                const counts = {};
                activePage.sections.forEach((s) => { counts[s.tier] = (counts[s.tier] || 0) + 1; });
                const total = activePage.sections.length;
                return TIERS.filter((t) => counts[t.id]).map((t) => (
                  <div key={t.id} style={{ marginBottom: 8 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                      <div style={{ fontSize: 10, color: t.color, fontWeight: 700 }}>{t.label}</div>
                      <div style={{ fontSize: 10, color: sn.g400 }}>{counts[t.id]} section{counts[t.id] > 1 ? "s" : ""}</div>
                    </div>
                    <div style={{ height: 4, background: sn.card, borderRadius: 2, overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${(counts[t.id] / total) * 100}%`, background: t.color, borderRadius: 2 }} />
                    </div>
                  </div>
                ));
              })()}
            </div>
          </div>

          {/* Wireframe canvas */}
          <div style={{ flex: 1, overflowY: "auto", padding: "20px 24px" }}>
            {/* Page meta */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 17, fontWeight: 800, marginBottom: 5 }}>{activePage.name}</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 20, fontSize: 12, color: sn.g400, marginBottom: 6 }}>
                <span>Audience: <span style={{ color: sn.g100 }}>{activePage.audience}</span></span>
                <span>Tier Range: <span style={{ color: sn.green, fontWeight: 700 }}>{activePage.tierRange}</span></span>
              </div>
              <div style={{ fontSize: 12, color: sn.g400, lineHeight: 1.65, maxWidth: 640 }}>{activePage.rationale}</div>
            </div>

            {/* Wireframe */}
            <div style={{ border: `1px solid ${sn.border}`, borderRadius: 12, overflow: "hidden", maxWidth: 740 }}>
              {/* Browser chrome */}
              <div style={{ background: sn.surface, padding: "8px 14px", display: "flex", alignItems: "center", gap: 8, borderBottom: `1px solid ${sn.border}` }}>
                <div style={{ display: "flex", gap: 5 }}>
                  {["#EF4444", "#F59E0B", "#62D84E"].map((c, i) => (
                    <div key={i} style={{ width: 8, height: 8, borderRadius: "50%", background: c }} />
                  ))}
                </div>
                <div style={{ flex: 1, background: sn.card, borderRadius: 4, padding: "3px 10px", fontSize: 10, color: sn.g500 }}>
                  servicenow.com
                </div>
              </div>

              {/* Nav bar */}
              <div style={{ background: "#0A1520", padding: "10px 20px", display: "flex", alignItems: "center", gap: 20, borderBottom: `1px solid ${sn.border}` }}>
                <div style={{ fontSize: 12, fontWeight: 800, color: sn.green }}>servicenow.</div>
                {["Platform", "Solutions", "Customers", "Learn"].map((n) => (
                  <div key={n} style={{ fontSize: 11, color: sn.g400 }}>{n}</div>
                ))}
                <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
                  <div style={{ border: `1px solid ${sn.border2}`, borderRadius: 4, padding: "3px 9px", fontSize: 10, color: sn.g100 }}>Sign In</div>
                  <div style={{ background: sn.green, borderRadius: 4, padding: "3px 10px", fontSize: 10, fontWeight: 700, color: "#0B1A09" }}>Watch Demo</div>
                </div>
              </div>

              {/* Content sections */}
              <div style={{ background: sn.bg }}>
                {activePage.sections.map((section, i) => {
                  const t = TIERS.find((x) => x.id === section.tier);
                  const isSel = selectedSection?.index === i;
                  const isHov = hoveredSection === i;
                  return (
                    <div
                      key={i}
                      onClick={() => setSelectedSection(isSel ? null : { ...section, index: i })}
                      onMouseEnter={() => setHoveredSection(i)}
                      onMouseLeave={() => setHoveredSection(null)}
                      style={{
                        minHeight: section.height,
                        borderBottom: `1px solid ${sn.border}`,
                        borderLeft: `4px solid ${isSel || isHov ? t.color : `rgba(${t.rgb},.35)`}`,
                        background: isSel ? `rgba(${t.rgb},.11)` : isHov ? `rgba(${t.rgb},.07)` : `rgba(${t.rgb},.03)`,
                        padding: "10px 16px",
                        cursor: "pointer",
                        transition: "all .15s",
                        display: "flex",
                        flexDirection: "column",
                        justifyContent: "space-between",
                        position: "relative",
                      }}
                    >
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                        <div style={{ flex: 1, marginRight: 12 }}>
                          <div style={{ fontSize: 12, fontWeight: 700, color: isSel || isHov ? sn.white : sn.g100, marginBottom: 4 }}>
                            {section.label}
                          </div>
                          <div style={{ fontSize: 11, color: sn.g400, lineHeight: 1.55, maxWidth: 500 }}>
                            {section.sub}
                          </div>
                        </div>
                        <div style={{
                          background: t.color, color: "#080D14",
                          borderRadius: 4, padding: "2px 8px",
                          fontSize: 9, fontWeight: 800, letterSpacing: ".06em",
                          flexShrink: 0, alignSelf: "flex-start",
                        }}>
                          {t.label}
                        </div>
                      </div>

                      {/* Column placeholders */}
                      {section.cols && (
                        <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                          {Array.from({ length: section.cols }).map((_, ci) => (
                            <div key={ci} style={{
                              flex: 1, height: 24, borderRadius: 5,
                              background: `rgba(${t.rgb},.12)`,
                              border: `1px solid rgba(${t.rgb},.2)`,
                            }} />
                          ))}
                        </div>
                      )}

                      {/* Hover hint */}
                      {isHov && !isSel && (
                        <div style={{ position: "absolute", bottom: 6, right: 14, fontSize: 9, color: sn.g500, fontStyle: "italic" }}>
                          Click to inspect tier →
                        </div>
                      )}
                    </div>
                  );
                })}

                {/* Footer */}
                <div style={{ height: 42, background: "#0A1520", display: "flex", alignItems: "center", padding: "0 20px" }}>
                  <div style={{ fontSize: 10, color: sn.border2 }}>
                    Global Footer — Platform · Solutions · Customers · Learn · Legal · Privacy
                  </div>
                </div>
              </div>
            </div>

            {/* Empty state hint */}
            {!selectedSection && (
              <div style={{ marginTop: 14, fontSize: 12, color: sn.g500, fontStyle: "italic" }}>
                Click any section in the wireframe to inspect its tier definition and voice guidelines.
              </div>
            )}
          </div>

          {/* Section inspector panel */}
          {selectedSection && (() => {
            const t = TIERS.find((x) => x.id === selectedSection.tier);
            return (
              <div style={{
                width: 290, borderLeft: `1px solid ${sn.border}`,
                padding: "18px 16px", overflowY: "auto", flexShrink: 0,
                background: sn.surface,
              }}>
                {/* Header */}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
                  <div>
                    <div style={{ fontSize: 11, fontWeight: 800, color: t.color, letterSpacing: ".08em", marginBottom: 3 }}>
                      {t.label} — {t.name}
                    </div>
                    <div style={{ fontSize: 10, color: sn.g400, fontStyle: "italic" }}>{t.altitude} · {t.tagline}</div>
                  </div>
                  <button
                    onClick={() => setSelectedSection(null)}
                    style={{ background: "none", border: "none", color: sn.g400, cursor: "pointer", fontSize: 15, lineHeight: 1 }}
                  >
                    ✕
                  </button>
                </div>

                {/* Section content */}
                <div style={{ background: `rgba(${t.rgb},.08)`, border: `1px solid rgba(${t.rgb},.2)`, borderRadius: 8, padding: 12, marginBottom: 16 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: sn.white, marginBottom: 5 }}>{selectedSection.label}</div>
                  <div style={{ fontSize: 11, color: sn.g100, lineHeight: 1.6 }}>{selectedSection.sub}</div>
                </div>

                <div style={{ height: 1, background: sn.border, marginBottom: 16 }} />

                {/* Tier definition */}
                <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".09em", color: sn.brand, marginBottom: 10 }}>
                  Tier definition
                </div>
                <div style={{ fontSize: 12, color: sn.g100, lineHeight: 1.7, marginBottom: 16 }}>{t.description}</div>

                {/* Voice note */}
                <div style={{ background: `rgba(${t.rgb},.07)`, border: `1px solid rgba(${t.rgb},.15)`, borderRadius: 8, padding: 12, marginBottom: 16 }}>
                  <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".09em", color: t.color, marginBottom: 8 }}>Voice note</div>
                  <div style={{ fontSize: 11, color: sn.g100, lineHeight: 1.65, fontStyle: "italic" }}>{t.voiceNote}</div>
                </div>

                {/* Examples */}
                <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".09em", color: sn.brand, marginBottom: 10 }}>
                  Copy examples
                </div>
                {t.examples.map((ex, i) => (
                  <div key={i} style={{
                    borderLeft: `3px solid ${t.color}`,
                    padding: "8px 12px", marginBottom: 10,
                    fontSize: 11, color: sn.g100, lineHeight: 1.65, fontStyle: "italic",
                    background: `rgba(${t.rgb},.04)`, borderRadius: "0 6px 6px 0",
                  }}>
                    {ex}
                  </div>
                ))}

                {/* Use / Don't use */}
                <div style={{ height: 1, background: sn.border, margin: "14px 0" }} />
                <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".09em", color: sn.brand, marginBottom: 10 }}>
                  When to use
                </div>
                {t.whenUse.map((w, i) => (
                  <div key={i} style={{ display: "flex", gap: 7, marginBottom: 7, alignItems: "flex-start" }}>
                    <div style={{ width: 4, height: 4, borderRadius: "50%", background: t.color, marginTop: 6, flexShrink: 0 }} />
                    <div style={{ fontSize: 11, color: sn.g100, lineHeight: 1.5 }}>{w}</div>
                  </div>
                ))}
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ContentTierSystem />);
  </script>
</body>
</html>
